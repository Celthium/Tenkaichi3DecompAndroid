# Fork-only build: the Dragon Rage APK installed BESIDE the official app (package com.dfdx047.dragonrage.teste,
# name "Dragon Rage (teste)", build.gradle.kts -PsideBySide), signed with the repository's fixed test key so each
# new build installs over the previous one. Same engine steps as android.yml; no release, no nightly, no BT4
# (its engine is in a draft release of the upstream repository, which a fork cannot read).
#
# Runs on a push to a branch named fork-* (or the "Run workflow" button once this file is on the default branch).
# The APK is the run's artifact "DragonRage-teste-<run>".
name: android-fork

on:
  push:
    branches: ["fork-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DR_VERSION_NAME: "1.0.2" # the official version, so the app's update check does not offer 1.0.2 again
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: port/build/android-toolchain/llvm
          key: llvm-21.1.0-linux-x64-v2
      - name: Engine toolchain
        working-directory: .
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" sh port/tools/android_toolchain.sh > toolchain.txt 2>&1 || { cat toolchain.txt; sh .github/annotate.sh toolchain.txt; exit 1; }
          tail -3 toolchain.txt
      - name: Engine
        working-directory: .
        env:
          BT3_SKELETON: "1"
        run: |
          python3 port/tools/android.py > engine_build.txt 2>&1 || true
          tail -5 engine_build.txt
          grep -q "^installed into" engine_build.txt || { tail -200 engine_build.txt; sh .github/annotate.sh engine_build.txt; exit 1; }
          ls -la android/app/src/main/jniLibs/arm64-v8a

      - name: BT2 plugin (libbt2online.so)
        continue-on-error: true
        working-directory: .
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" python3 bt2/android/build.py plugin > bt2_plugin.txt 2>&1 || { tail -40 bt2_plugin.txt; exit 1; }
          tail -2 bt2_plugin.txt

      - name: Build (side by side)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PsideBySide > ../gradle.txt 2>&1 || { grep -E "^e: |error:|FAILURE|What went wrong" -A3 ../gradle.txt || true; tail -60 ../gradle.txt; sh ../.github/annotate.sh ../gradle.txt; exit 1; }

      - name: Check package and signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^application-label:"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > ../signer.txt
          cat ../signer.txt
          # the repository's test key (android/app/dragonrage-test.jks, CN=Dragon Rage test builds)
          grep -qi "certificate SHA-256 digest: 10db404f3450f5ff3e073e7926857381b372bd2efd380dc9e75bc9a9232f2757" ../signer.txt \
            || { echo "::error::the APK is not signed with the repository's test key"; exit 1; }
          mkdir -p ../out && cp "$APK" "../out/DragonRage-teste-${DR_VERSION_NAME}-run${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DragonRage-teste-${{ github.run_number }}
          path: out/*.apk
